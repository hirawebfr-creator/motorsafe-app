name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      # Mock providers for tests
      EMAIL_PROVIDER: mock
      STRIPE_MODE: mock
      VEHICLE_LOOKUP_PROVIDER: mock
      DISABLE_RATE_LIMIT: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck || echo "No typecheck script"

      - name: Build
        run: npm run build

      # Note: Full E2E tests require a running server and DB
      # They should be run in a separate workflow with proper setup
      # For now, we just verify the build passes
