name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Security: Scan for leaked secrets before other jobs
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Run Gitleaks (secrets detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check .env files not committed
        run: |
          if git ls-files --error-unmatch .env .env.local .env.production 2>/dev/null; then
            echo "ERROR: .env files should not be committed!"
            exit 1
          fi
          echo "✓ No .env files in repository"

  build:
    runs-on: ubuntu-latest
    needs: secrets-scan  # Only build if secrets scan passes
    env:
      NODE_ENV: development
      # Mock providers for tests
      EMAIL_PROVIDER: mock
      STRIPE_MODE: mock
      VEHICLE_LOOKUP_PROVIDER: mock
      DISABLE_RATE_LIMIT: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck || echo "No typecheck script"

      - name: Build
        run: npm run build

      # Note: Full E2E tests require a running server and DB
      # They should be run in a separate workflow with proper setup
      # For now, we just verify the build passes
