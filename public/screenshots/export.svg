<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#1a1a2e"/>
  <rect x="20" y="20" width="760" height="60" rx="8" fill="#16213e"/>
  <text x="40" y="58" font-family="system-ui, sans-serif" font-size="20" fill="#e2e8f0">SafeMotor</text>
  
  <!-- Modal overlay -->
  <rect width="800" height="450" fill="#000000" opacity="0.5"/>
  
  <!-- Export modal -->
  <rect x="150" y="80" width="500" height="290" rx="12" fill="#16213e"/>
  <text x="180" y="120" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">Export Assurance-Ready</text>
  <text x="180" y="145" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Intervention #INT-2026-0042 • Peugeot 308</text>
  
  <!-- ZIP icon -->
  <rect x="180" y="165" width="60" height="70" rx="4" fill="#3b82f6"/>
