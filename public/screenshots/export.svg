  <!-- File list -->
  <rect x="260" y="165" width="360" height="140" rx="6" fill="#1e3a5f"/>
  <text x="280" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Contenu du dossier :</text>
  
  <text x="280" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e">✓</text>
  <text x="300" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">ordre-reparation-signe.pdf</text>
  <text x="550" y="215" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">SHA256: a3f2...</text>
  
  <text x="280" y="235" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e">✓</text>
  <text x="300" y="235" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">pv-restitution-signe.pdf</text>
  <text x="550" y="235" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">SHA256: b7e1...</text>
  
  <text x="280" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e">✓</text>
  <text x="300" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">photos-entree/ (3 fichiers)</text>
  
  <text x="280" y="275" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e">✓</text>
  <text x="300" y="275" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">audit-trail.json</text>
  
  <text x="280" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e">✓</text>
  <text x="300" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">verification.txt</text>
  
  <!-- Buttons -->
  <rect x="180" y="320" width="200" height="36" rx="4" fill="#22c55e"/>
  <text x="225" y="343" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Télécharger le ZIP</text>
  
  <rect x="400" y="320" width="120" height="36" rx="4" fill="#1e3a5f"/>
  <text x="430" y="343" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">Annuler</text>
